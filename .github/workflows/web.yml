name: Web - Build & Deploy (Vercel)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck & Build (React Router + Vite)
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout do monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configurar Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Verificar tipos (TypeScript & React Router)
        run: npm run typecheck

      - name: Executar testes unitários com cobertura (Vitest)
        run: npm run test:cov

      - name: Compilar aplicação para produção
        run: npm run build

      - name: Publicar relatório de cobertura (usado pelo Sonar)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-coverage
          path: web/coverage/lcov.info
          retention-days: 7

      - name: Publicar artefato de build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: web/build
          retention-days: 7

  sonar:
    name: SonarQube Quality Gate (React Router + Vite)
    needs: build
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Verificar configuração do Sonar
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::error::Secret SONAR_TOKEN não configurada. O Quality Gate do SonarQube é obrigatório."
          exit 1

      - name: Checkout do monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # histórico completo melhora a análise do Sonar (blame / new code)

      - name: Baixar relatório de cobertura
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-coverage
          path: web/coverage

      - name: Análise SonarQube Cloud + Quality Gate
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          projectBaseDir: web
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'vezcerta' }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_WEB || 'VezCerta_saude_digital_web' }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Gerar relatório de problemas do Sonar
        if: always() && env.SONAR_TOKEN != ''
        continue-on-error: true
        run: node .github/scripts/sonar-report.mjs
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'vezcerta' }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY_WEB || 'VezCerta_saude_digital_web' }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_BRANCH: ${{ github.event_name != 'pull_request' && github.ref_name || '' }}
          OUTPUT_DIR: sonar-report

      - name: Publicar relatório do Sonar
        if: always() && env.SONAR_TOKEN != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonar-report-web
          path: sonar-report/
          if-no-files-found: ignore
          retention-days: 30

  gemini-review:
    name: Feedback de código (Gemini)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/gemini-review.yml
    with:
      path: web
      label: Web (React Router + Vite)
    secrets: inherit

  deploy-vercel:
    name: Deploy na Vercel
    needs: [build, sonar]
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout do monorepo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configurar Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Deploy via Vercel CLI (ou Deploy Hook)
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            npm install --global --ignore-scripts vercel@66.2.0
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          elif [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Acionando Deploy Hook da Vercel..."
            curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "Configure VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID (ou VERCEL_DEPLOY_HOOK_URL) em Settings > Secrets and variables > Actions."
          fi
