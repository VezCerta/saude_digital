# SonarQube Cloud - Backend (NestJS)
# sonar.organization e sonar.projectKey são passados pelo pipeline
# (variáveis SONAR_ORGANIZATION / SONAR_PROJECT_KEY_BACKEND), com valores padrão abaixo.
sonar.projectKey=VezCerta_saude_digital_backend
sonar.projectName=Saúde Digital - Backend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,test
sonar.inclusions=src/**/*.ts
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,**/*.spec.ts,**/*.e2e-spec.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.module.ts,src/main.ts,**/entities/**,**/*.dto.ts
